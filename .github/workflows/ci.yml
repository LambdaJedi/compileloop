name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: mvn test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show toolchain
        shell: bash
        run: |
          java -version
          mvn -version

      - name: Build and test
        run: mvn -B test

      # Only runs when the build/test step failed: print Surefire's per-class
      # reports so the cause is visible in the log without downloading anything.
      - name: Show test failure details
        if: failure()
        shell: bash
        run: |
          for f in target/surefire-reports/*.txt; do
            echo "=== $f"
            cat "$f"
          done
